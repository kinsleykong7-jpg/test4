<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinsley's Personal Space</title>

<style>
:root {
  --black: #111;
  --white: #fff;
  --gray: #666;
  /* 使用系统自带的高级几何无衬线与打字机字体，零网络请求，杜绝空白卡死 */
  --futura-font: Futura, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --typewriter: "Courier New", Courier, monospace;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--black)}

body {
  font-family: var(--futura-font);
  overflow-x: hidden;
  letter-spacing: 0.03em;
}

#snow {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

/* 蓝色雪花与高对比度圆点 */
.flake {
  position: absolute;
  top: -30px;
  left: var(--x);
  opacity: var(--o);
  color: #4a90e2;
  font-size: var(--s);
  animation: fall var(--t) linear var(--d) infinite;
  user-select: none;
}
.flake.ball {
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #222;
  box-shadow: 0 0 2px rgba(0,0,0,0.2);
}

@keyframes fall {
  to {
    transform: translate3d(var(--drift), 112vh, 0) rotate(360deg);
  }
}

main {
  position: relative;
  z-index: 1;
  max-width: 850px;
  min-height: 100svh;
  margin: auto;
  padding: 36px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 顶部标题放大且采用 Futura 几何无衬线体 */
header {
  font-family: var(--futura-font);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .25em;
  text-align: center;
  padding: 12px 0 20px;
  color: #111;
}

.scene {
  position: relative;
  width: 100%;
  height: 520px;
  overflow: hidden;
}

/* 马吉拉解构风高级雪人容器 */
.margiela-snowman {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 280px;
  height: 360px;
  transform: translate(-50%, -50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.m-head, .m-body {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border: 1.5px dashed #111;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.98);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 25px rgba(0,0,0,0.04);
}

.m-head {
  top: 10px;
  width: 115px;
  height: 115px;
  border-style: solid;
}

.m-body {
  top: 120px;
  width: 210px;
  height: 210px;
}

.m-hat {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 42px;
  height: 30px;
  border: 1.5px solid #111;
  background: #fff;
  z-index: 4;
}
.m-hat::after {
  content: "";
  position: absolute;
  bottom: -3px;
  left: -8px;
  width: 58px;
  height: 3px;
  background: #111;
}

.timer-box {
  text-align: center;
  z-index: 5;
  font-family: var(--typewriter);
}

/* 倒计时层级：数字比文字大，Hours Lived 比 Birthday 更大 */
.birthday-val {
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700;
  letter-spacing: -.02em;
}
.lived-val {
  font-size: clamp(24px, 4.8vw, 32px);
  font-weight: 700;
  letter-spacing: -.02em;
}

.label {
  display: block;
  margin-top: 3px;
  font-size: 8px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--gray);
  font-family: var(--futura-font);
}

/* 字母/数字流：贯穿到底部并消失在屏幕外 */
.wordfield {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.word {
  position: absolute;
  right: -25%;
  top: var(--y);
  font-size: var(--size);
  font-weight: 600;
  font-family: var(--typewriter);
  white-space: nowrap;
  letter-spacing: -.03em;
  opacity: 0;
  animation: pourDown var(--duration) linear var(--delay) infinite;
  user-select: none;
}

@keyframes pourDown {
  0% {
    transform: translate(0, -15vh) rotate(var(--rot));
    opacity: 0;
  }
  12% { opacity: 0.9; }
  85% { opacity: 0.8; }
  100% {
    transform: translate(-140vw, 105vh) rotate(calc(var(--rot) - 30deg));
    opacity: 0;
  }
}

/* 极简高级感音乐播放器 */
.player {
  z-index: 4;
  width: min(540px, 100%);
  border-top: 1px solid #111;
  padding-top: 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  margin-top: auto;
  background: #fff;
}

.cover {
  width: 48px;
  height: 48px;
  border: 1px solid #111;
  background: #111;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 10px;
}

.player-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.player-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.song { font-size: 13px; font-weight: 700; }
.artist { font-size: 10px; color: var(--gray); }

.controls-btns {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--futura-font);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 4px;
  color: var(--black);
  user-select: none;
}
.btn:hover { opacity: 0.6; }

.progress-bar {
  width: 100%;
  height: 2px;
  background: #eee;
  position: relative;
  cursor: pointer;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #111;
}

@media(max-width:600px){
  main{padding:20px 14px 24px}
  .scene{height:460px}
  .margiela-snowman{transform:translate(-50%,-50%) scale(0.85)}
}
</style>
</head>
<body>

<div id="snow" aria-hidden="true"></div>

<main>
  <header>KINSLEY'S PERSONAL SPACE</header>

  <section class="scene">
    <div class="wordfield" id="wordfield"></div>

    <!-- 马吉拉解构风高级雪人 -->
    <div class="margiela-snowman">
      <div class="m-hat"></div>
      <div class="m-head">
        <div class="timer-box">
          <div class="birthday-val" id="birthday">--:--:--</div>
          <span class="label">Birthday</span>
        </div>
      </div>
      <div class="m-body">
        <div class="timer-box">
          <div class="lived-val" id="lived">--:--:--</div>
          <span class="label">Hours Lived</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 音乐播放器 -->
  <div class="player">
    <div class="cover">K.C</div>
    <div class="player-info">
      <div class="player-meta">
        <div>
          <span class="song" id="songTitle">My Playlist</span>
          <span class="artist" id="artistName">Kinsley's Choice</span>
        </div>
        <div class="controls-btns">
          <button class="btn" id="playBtn">▶ PLAY</button>
        </div>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>
</main>

<audio id="audioPlayer" preload="none"></audio>

<script>
// 1. 动态蓝色雪花与高对比度圆点生成
const snow = document.querySelector('#snow');
const flakeCount = innerWidth < 600 ? 40 : 75;

for (let i = 0; i < flakeCount; i++) {
  const f = document.createElement('span');
  const isBall = Math.random() < 0.
