<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinsley's Personal Space</title>
<!-- 引入 Futura 风格的几何无衬线字体 (League Spartan / Futura 替代方案) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --black: #111;
  --white: #fff;
  --gray: #666;
  --futura-font: 'League Spartan', Futura, -apple-system, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--black)}

/* 全局应用 Futura 几何无衬线字体 */
body {
  font-family: var(--futura-font);
  overflow-x: hidden;
  letter-spacing: 0.03em;
}

#snow {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

/* 蓝色雪花与清晰可见的圆点 */
.flake {
  position: absolute;
  top: -30px;
  left: var(--x);
  opacity: var(--o);
  color: #4a90e2; /* 蓝色的雪花 */
  font-size: var(--s);
  animation: fall var(--t) linear var(--d) infinite;
  user-select: none;
}
.flake.ball {
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #222; /* 确保圆点清晰可见，不被白色背景覆盖 */
  box-shadow: 0 0 2px rgba(0,0,0,0.2);
}

@keyframes fall {
  to {
    transform: translate3d(var(--drift), 112vh, 0) rotate(360deg);
  }
}

main {
  position: relative;
  z-index: 1;
  max-width: 850px;
  min-height: 100svh;
  margin: auto;
  padding: 36px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 4. 顶部标题字体放大且采用 Futura */
header {
  font-family: var(--futura-font);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .25em;
  text-align: center;
  padding: 12px 0 20px;
  color: #111;
}

.scene {
  position: relative;
  width: 100%;
  height: 520px;
  overflow: hidden;
}

/* 马吉拉解构风高级雪人容器 */
.margiela-snowman {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 280px;
  height: 360px;
  transform: translate(-50%, -50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.m-head, .m-body {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border: 1.5px dashed #111;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.98);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 25px rgba(0,0,0,0.04);
}

.m-head {
  top: 10px;
  width: 115px;
  height: 115px;
  border-style: solid;
}

.m-body {
  top: 120px;
  width: 210px;
  height: 210px;
}

.m-hat {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 42px;
  height: 30px;
  border: 1.5px solid #111;
  background: #fff;
  z-index: 4;
}
.m-hat::after {
  content: "";
  position: absolute;
  bottom: -3px;
  left: -8px;
  width: 58px;
  height: 3px;
  background: #111;
}

.timer-box {
  text-align: center;
  z-index: 5;
}

/* 2. 倒计时层级：数字比文字大，Hours Lived 比 Birthday 更大 */
.birthday-val {
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700;
  letter-spacing: -.02em;
}
.lived-val {
  font-size: clamp(24px, 4.8vw, 32px); /* 下方倒计时明显更大 */
  font-weight: 700;
  letter-spacing: -.02em;
}

.label {
  display: block;
  margin-top: 3px;
  font-size: 8px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--gray);
}

/* 1. 字母/数字流：贯穿到底部并消失在屏幕外 */
.wordfield {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.word {
  position: absolute;
  right: -25%;
  top: var(--y);
  font-size: var(--size);
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: -.03em;
  opacity: 0;
  animation: pourDown var(--duration) linear var(--delay) infinite;
  user-select: none;
}

@keyframes pourDown {
  0% {
    transform: translate(0, -15vh) rotate(var(--rot));
    opacity: 0;
  }
  12% { opacity: 0.9; }
  85% { opacity: 0.8; }
  100% {
    /* 彻底落到屏幕最下方，穿过播放器区域并淡出 */
    transform: translate(-140vw, 105vh) rotate(calc(var(--rot) - 30deg));
    opacity: 0;
  }
}

/* 极简高级感音乐播放器 */
.player {
  z-index: 4;
  width: min(540px, 100%);
  border-top: 1px solid #111;
  padding-top: 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  margin-top: auto;
  background: #fff;
}

.cover {
  width: 48px;
  height: 48px;
  border: 1px solid #111;
  background: #111;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 10px;
}

.player-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.player-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.song { font-size: 13px; font-weight: 700; }
.artist { font-size: 10px; color: var(--gray); }

.controls-btns {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--futura-font);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 4px;
  color: var(--black);
  user-select: none;
}
.btn:hover { opacity: 0.6; }

.progress-bar {
  width: 100%;
  height: 2px;
  background: #eee;
  position: relative;
  cursor: pointer;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #111;
}

@media(max-width:600px){
  main{padding:20px 14px 24px}
  .scene{height:460px}
  .margiela-snowman{transform:translate(-50%,-50%) scale(0.85)}
}
</style>
</head>
<body>

<div id="snow" aria-hidden="true"></div>

<main>
  <header>KINSLEY'S PERSONAL SPACE</header>

  <section class="scene">
    <div class="wordfield" id="wordfield"></div>

    <!-- 马吉拉解构风高级雪人 -->
    <div class="margiela-snowman">
      <div class="m-hat"></div>
      <div class="m-head">
        <div class="timer-box">
          <div class="birthday-val" id="birthday">--:--:--</div>
          <span class="label">Birthday</span>
        </div>
      </div>
      <div class="m-body">
        <div class="timer-box">
          <div class="lived-val" id="lived">--:--:--</div>
          <span class="label">Hours Lived</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 音乐播放器 -->
  <div class="player">
    <div class="cover">K.C</div>
    <div class="player-info">
      <div class="player-meta">
        <div>
          <span class="song" id="songTitle">My Playlist</span>
          <span class="artist" id="artistName">Kinsley's Choice</span>
        </div>
        <div class="controls-btns">
          <button class="btn" id="playBtn">▶ PLAY</button>
        </div>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>
</main>

<audio id="audioPlayer" preload="none"></audio>

<script>
// 1. 动态蓝色雪花与高对比度圆点生成
const snow = document.querySelector('#snow');
const flakeCount = innerWidth < 600 ? 40 : 75;

for (let i = 0; i < flakeCount; i++) {
  const f = document.createElement('span');
  const isBall = Math.random() < 0.22;
  f.className = 'flake' + (isBall ? ' ball' : '');
  if (!isBall) f.textContent = '❄';

  f.style.setProperty('--x', Math.random() * 100 + '%');
  f.style.setProperty('--s', (isBall ? 3 + Math.random() * 3 : 9 + Math.random() * 11) + 'px');
  f.style.setProperty('--o', 0.3 + Math.random() * 0.6);
  f.style.setProperty('--t', (10 + Math.random() * 16) + 's');
  f.style.setProperty('--d', (-Math.random() * 22) + 's');
  f.style.setProperty('--drift', (-60 + Math.random() * 120) + 'px');
  snow.append(f);
}

// 3. 从右往左倾泻的 26个英文字母与 0-9 数字池（大小错落，最大比原来小一点，最小适中）
const charPool = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyz".split('');

const field = document.querySelector('#wordfield');
for (let i = 0; i < 22; i++) {
  const char = charPool[Math.floor(Math.random() * charPool.length)];
  const e = document.createElement('span');
  e.className = 'word';
  e.textContent = char;

  // 尺寸调整：最大比之前小一点（限制在 14px - 28px 之间），最小也不太小
  const size = 14 + Math.random() * 14;
  
  e.style.setProperty('--y', (2 + (i * 8) % 75) + '%');
  e.style.setProperty('--size', size + 'px');
  e.style.setProperty('--rot', (-35 + Math.random() * 70) + 'deg');
  e.style.setProperty('--duration', (12 + Math.random() * 10) + 's');
  e.style.setProperty('--delay', (-i * 1.5) + 's');
  field.append(e);
}

// 2. 倒计时实时计算（Hours Lived 字体大于 Birthday）
const birth = new Date(2002, 11, 22, 0, 0, 0);
const pad = n => String(n).padStart(2, '0');

function tick() {
  const now = new Date();
  let sLived = Math.max(0, Math.floor((now - birth) / 1000));
  const livedEl = document.querySelector('#lived');
  if(livedEl) livedEl.textContent = `${Math.floor(sLived / 3600)}:${pad(Math.floor((sLived % 3600) / 60))}:${pad(sLived % 60)}`;

  let next = new Date(now.getFullYear(), 11, 22);
  if (now >= next) next = new Date(now.getFullYear() + 1, 11, 22);
  let sBirth = Math.max(0, Math.floor((next - now) / 1000));
  const birthEl = document.querySelector('#birthday');
  if(birthEl) birthEl.textContent = `${Math.floor(sBirth / 86400) * 24 + Math.floor((sBirth % 86400) / 3600)}:${pad(Math.floor((sBirth % 3600) / 60))}:${pad(sBirth % 60)}`;
}
tick();
setInterval(tick, 1000);

// 音乐播放器基础控制
const audio = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');

playBtn.addEventListener('click', () => {
  if(!audio.src || audio.src.endsWith('/')) {
    alert("播放器准备就绪！后续在源码中填入 MP3 音频链接即可播放。");
    return;
  }
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '❚❚ PAUSE';
  } else {
    audio.pause();
    playBtn.textContent = '▶ PLAY';
  }
});
</script>
</body>
</html>
