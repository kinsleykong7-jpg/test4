<title>Kinsley's Personal Space</title>

<style>
:root {
  --black: #111;
  --white: #fff;
  --gray: #666;
  --futura-font: Futura, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --typewriter-font: 'Courier Prime', Courier, 'Courier New', monospace;
  --bodoni-font: "Bodoni 72", Didot, "Times New Roman", serif;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--black)}

body {
  font-family: var(--futura-font);
  overflow-x: hidden;
  letter-spacing: 0.02em;
}

#snow {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

/* 蓝色雪花与高对比度可见圆球 */
.flake {
  position: absolute;
  top: -30px;
  left: var(--x);
  opacity: var(--o);
  color: #4a90e2;
  font-size: var(--s);
  animation: fall var(--t) linear var(--d) infinite;
  user-select: none;
}
.flake.ball {
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #333;
  box-shadow: 0 0 3px rgba(0,0,0,0.25);
}

@keyframes fall {
  to {
    transform: translate3d(var(--drift), 118vh, 0) rotate(360deg);
  }
}

main {
  position: relative;
  z-index: 1;
  max-width: 900px;
  min-height: 100svh;
  margin: auto;
  padding: 32px 22px 38px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 2 & 4. 顶部标题使用加粗 Bodoni 字体并放大，右下方附带 No. 22 */
.site-header {
  text-align: center;
  padding: 16px 0 28px;
}

.title-wrap {
  display: inline-block;
  position: relative;
}

.main-title {
  font-family: var(--bodoni-font);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .25em;
  color: #111;
}
